reviews:
  - date: '2026-09-01'
    rating: 3
    summary: >-
      University pipeline re-profile with operator attribution. The June 2026 review found
      two surfaces, both FDAT. Three more institution-operated surfaces were found this run
      and all five were re-probed live: (1) a second, far older OAI-PMH provider for the
      University Library's TOBIAS-lib DSpace publication server at
      publikationen.uni-tuebingen.de/oai/request, with records back to 1998-12-16 and the
      German xMetaDissPlus dissertation profile — missed entirely in June; (2) the
      university's own Shibboleth SAML 2.0 identity provider, entityID
      https://idp.uni-tuebingen.de/shibboleth, registered in DFN-AAI since 2009-05-26,
      exported to eduGAIN, asserting REFEDS R&S and SIRTFI/SIRTFI2 and holding its own key
      (CN=idp.uni-tuebingen.de, OU=ZDV) — the strongest institution-operated machine
      surface here and the class universities are most often missing from the catalog;
      (3) TueFind, the library's own VuFind derivative developed in the open at
      github.com/ubtue/tuefind and running ixTheo, RelBib and KrimDok, currently behind a
      SHA-256 proof-of-work browser challenge on every path. Two registry memberships were
      evidenced and recorded as memberships rather than contracts: DataCite (member AWZY
      "IKM Universität Tübingen", repository client AWZY.FEDNNV, DOI prefix 10.57754,
      re3data r3d100012296) and ROR (03a1kwz48). One tenant relationship was recorded: the
      library catalogue on the IBS|BW consortium platform. No OpenAPI, developer portal,
      llms.txt, .well-known document or key issuance exists, and none was generated — the
      InvenioRDM, DSpace and VuFind contracts belong to their upstream projects, not to
      Tübingen. Rate limits are now probed fact rather than prose: X-RateLimit-Limit 500,
      Retry-After 60 on the FDAT API.
