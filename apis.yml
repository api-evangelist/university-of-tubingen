apis:
  - aid: university-of-tubingen:fdat-rest
    name: FDAT Repository REST API
    x-operator: institution
    description: >-
      Keyless, read-only JSON REST API of FDAT, the university's institutional
      research data repository, operated by the Digital Humanities Center on the
      InvenioRDM platform and served from the university's own host
      fdat.uni-tuebingen.de. Verified live 2026-09-01: GET /api/records?size=1
      returns 200 application/json with 437 published records and faceted
      aggregations (access_status open 265 / restricted 169 / embargoed 2 /
      metadata-only 1, file_type, resource_type); GET /api/records/{id} returns
      200 with ETag, a Link rel="linkset" header and a links object exposing doi,
      self_doi, parent_doi, files, media_files, versions, archive, communities,
      access_grants, requests and both self_iiif_manifest and self_iiif_sequence;
      GET /api/communities and GET /api/vocabularies/languages also return 200.
      Records carry DataCite DOIs under the university's own prefix (e.g.
      10.57754/FDAT.zvknn-g0x34) and typed ORCID identifiers on creators. Rate
      limiting is advertised in headers — X-RateLimit-Limit 500, Retry-After 60.
      Errors are a plain JSON envelope: {"status": 404, "message": "The
      persistent identifier does not exist."}. The contract itself is
      InvenioRDM's, shared by every deployment of that software, so no OpenAPI is
      saved under this institution — but the deployment, the host, the admin
      contact and the data are Tübingen's. Note that robots.txt disallows /api
      for crawlers; the endpoint is open but bulk crawling is not invited.
    humanURL: https://uni-tuebingen.de/en/249679
    baseURL: https://fdat.uni-tuebingen.de/api/records
    tags: [ Research Data, Repository, InvenioRDM, DataCite, IIIF, ORCID ]
    properties:
