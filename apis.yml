aid: university-of-tubingen
name: University of Tübingen
x-type: university
x-category: Public Research University
description: >-
  The University of Tübingen (Eberhard Karls Universität Tübingen), founded in
  1477, is one of Germany's oldest public research universities and a member of
  the German Universities Excellence Initiative, with roughly 27,000 students in
  Baden-Württemberg. It runs no developer portal, publishes no OpenAPI and issues
  no API keys, and this profile does not pretend otherwise. What it does operate,
  on its own uni-tuebingen.de hosts, are four genuinely institution-run machine
  surfaces: the FDAT research data repository (InvenioRDM, Digital Humanities
  Center) exposing a keyless JSON REST API with IIIF manifests and DataCite DOIs;
  an OAI-PMH 2.0 provider on the same host; a second, much older OAI-PMH provider
  for the University Library's TOBIAS-lib publication server (DSpace, records back
  to 1998, xMetaDissPlus); and a Shibboleth SAML 2.0 identity provider registered
  in DFN-AAI since 2009 and exported to eduGAIN, asserting REFEDS Research &
  Scholarship and SIRTFI/SIRTFI2. Its DataCite membership is verifiable — member
  AWZY "IKM Universität Tübingen", repository client AWZY.FEDNNV, DOI prefix
  10.57754 — as is its ROR record 03a1kwz48. The University Library additionally
  builds and operates TueFind, its own VuFind derivative, in the open on GitHub,
  and runs three national subject discovery services on it (ixTheo, RelBib,
  KrimDok), currently behind a proof-of-work browser challenge. Campus management
  (alma), the VLE and the licensed library estate sit behind SSO and are not
  publicly documented APIs. No InvenioRDM, DSpace or VuFind product contract is
  saved under this institution — those belong to their upstream projects.
