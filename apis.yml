  - aid: university-of-tubingen:datacite-membership
    name: DataCite membership and DOI registration (member AWZY)
    x-operator: registry
    description: >-
      The university is a DataCite member and DOI registrant — a fact about the
      institution, recorded here as a membership rather than as a contract. The
      DataCite REST API is DataCite's and is never saved under this slug.
      Evidence, verified 2026-09-01: https://api.datacite.org/providers/awzy
      returns member AWZY, name "IKM Universität Tübingen", memberType
      consortium_organization, country DE, created 2020-11-09, rorId
      https://ror.org/03a1kwz48. https://api.datacite.org/clients/awzy.fednnv
      returns repository client AWZY.FEDNNV, name "FDAT", url
      https://fdat.uni-tuebingen.de, clientType repository, year 2022, re3data
      https://doi.org/10.17616/R3PM1K (re3data r3d100012296).
      https://api.datacite.org/prefixes/10.57754 relates DOI prefix 10.57754 to
      that client and provider, and live FDAT records mint DOIs of the form
      10.57754/FDAT.{id}. Six further repository clients sit under the same AWZY
      member, reflecting UB Tübingen's role as a DOI agent for theology
      publications. No Crossref membership exists — api.crossref.org returns zero
      results for Tübingen.
    humanURL: https://www.re3data.org/repository/r3d100012296
    baseURL: https://api.datacite.org/clients/awzy.fednnv
    tags: [ DataCite, DOI, Registry, Membership, Research Data, Persistent Identifiers ]
    properties:
      - type: Conformance
        url: conformance/university-of-tubingen-conformance.yml
  - aid: university-of-tubingen:ror-registration
    name: ROR registration (Research Organization Registry)
    x-operator: registry
    description: >-
      The institution's entry in the Research Organization Registry, ROR ID
      https://ror.org/03a1kwz48. A registry membership, not a contract — the ROR
      API is ROR's. Verified 2026-09-01 via
      https://api.ror.org/organizations/03a1kwz48 (200), which returns the
      University of Tübingen with website
      https://www.uni-tuebingen.de/en/university.html. This is the same ROR ID
      DataCite carries on the university's member record (AWZY), which is what
      ties the DOI registrant to the institution rather than to a vendor. Note
      that the neighbouring Tübingen ROR record 00pjgxh97 is the University
      HOSPITAL (Universitätsklinikum Tübingen, UKT) — a legally distinct body and
      not this institution.
    humanURL: https://ror.org/03a1kwz48
    baseURL: https://api.ror.org/organizations/03a1kwz48
    tags: [ ROR, Registry, Membership, Persistent Identifiers, Research ]
  - aid: university-of-tubingen:tuefind-discovery
    name: TueFind subject discovery services (ixTheo, RelBib, KrimDok)
    x-operator: institution
    description: >-
      Three national subject-information discovery services built and operated by
      Tübingen University Library on TueFind, the library's own VuFind derivative,
      whose source it develops in the open at https://github.com/ubtue/tuefind
      (PHP, actively committed as of 2026-09-01). ixTheo (Index Theologicus,
      ixtheo.de), RelBib (relbib.de) and KrimDok (krimdok.uni-tuebingen.de) are
      DFG-funded Fachinformationsdienste — the software, the hosting and the data
      curation are all the library's. VuFind exposes a /api/v1 search and record
      API, but as of 2026-09-01 all three hosts sit behind a SHA-256
      proof-of-work browser-verification interstitial (17 leading zero bits,
      pow_token cookie, 1800s TTL) that answers 200 with an identical 2,148-byte
      challenge page for every path, including /api/v1/search. The challenge page
      is branded with the University of Tübingen and University Library logos,
      which confirms the operator. Recorded as a live but bot-challenged surface,
      not as a dead one, and NOT as a verified API contract — the challenge was
      not defeated. The VuFind contract would in any case be the product's.
    humanURL: https://ixtheo.de/
    baseURL: https://ixtheo.de/api/v1
    tags: [ Library, Discovery, VuFind, TueFind, Open Source, Bot Challenge ]
    properties:
      - type: SourceCode
        url: https://github.com/ubtue/tuefind
  - aid: university-of-tubingen:library-discovery
    name: UB Tübingen library catalogue (IBS|BW consortium tenant)
    x-operator: tenant
    description: >-
      The University Library's main catalogue and discovery interface. Verified
      2026-09-01: https://katalog.ub.uni-tuebingen.de/ redirects (301) to
      https://rds-tue.ibs-bw.de/opac/, a Tübingen-scoped instance on the IBS|BW
      (Integriertes Bibliothekssystem Baden-Württemberg) consortium platform,
      which answers 403 to an anonymous non-browser client. The instance and its
      holdings are Tübingen's; the platform and its contract belong to the
      consortium and its library-systems vendor, so nothing is saved here. Its
      companion campus portal alma.uni-tuebingen.de serves a meta-refresh into
      /alma/rds?state=user — a login portal, no public API. Recorded as a tenant
      relationship, which is a real institutional fact.
    humanURL: https://ub.uni-tuebingen.de/
    baseURL: https://rds-tue.ibs-bw.de/opac/
    tags: [ Library, Discovery, Catalog, Tenant, IBS|BW ]
