x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated machine surfaces were found and verified live on
    2026-09-01 — the FDAT InvenioRDM REST API and its OAI-PMH provider on
    fdat.uni-tuebingen.de, a second and far older OAI-PMH provider for the
    University Library's TOBIAS-lib DSpace publication server on
    publikationen.uni-tuebingen.de (records back to 1998, xMetaDissPlus), and a
    Shibboleth SAML 2.0 identity provider published in the DFN-AAI metadata
    aggregate and exported to eduGAIN. Five education-regime domain standards are
    evidenced from public endpoints: oai-pmh, shibboleth, saml, orcid and
    datacite. Two registry memberships are recorded as memberships, never as
    contracts: DataCite (member AWZY "IKM Universität Tübingen", client
    AWZY.FEDNNV, prefix 10.57754) and ROR (03a1kwz48). One tenant relationship is
    recorded: the library catalogue on the IBS|BW consortium platform
    (katalog.ub.uni-tuebingen.de → rds-tue.ibs-bw.de). No OpenAPI, no developer
    portal, no llms.txt, no .well-known document and no self-service key issuance
    exist anywhere on the institution's public surface, and no contract has been
    generated to stand in for one — the InvenioRDM, DSpace and VuFind contracts
    are product contracts shared by every deployment of that software and belong
    in their upstream repos, not here. The library's own TueFind VuFind
    derivative (ixTheo, RelBib, KrimDok) is genuinely institution-built and
    open-source on GitHub, but all three hosts currently answer every path,
    /api/v1 included, with a SHA-256 proof-of-work browser challenge; that is
    recorded as live-but-challenged and the challenge was not defeated. Campus
    management (alma), the VLE (ILIAS/Moodle) and the licensed library estate sit
    behind SSO and were not probeable. No Crossref membership and no open-data
    portal exist — data. and opendata.uni-tuebingen.de do not resolve at all.
